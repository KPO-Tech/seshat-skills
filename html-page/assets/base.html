<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page title</title>
<style>
/* Tokens: change these, never hard-code colours in the elements. */
:root{
  --bg:#fafaf9; --surface:#fff; --text:#1c1917; --muted:#78716c; --border:#e7e5e4;
  --accent:#ea580c; --accent-soft:#fff1e8;
  --blue:#2563eb; --green:#16a34a; --amber:#d97706; --red:#dc2626;
  --radius:14px; --shadow:0 1px 2px rgba(28,25,23,.06),0 4px 16px rgba(28,25,23,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
/* Dark variant, only when the reader asks for it: replace the values, keep the names. */
/* :root{--bg:#161412;--surface:#1f1c1a;--text:#f5f5f4;--muted:#a8a29e;--border:#2e2a27;--accent-soft:#2b1a10} */

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
main{max-width:1100px;margin:0 auto;padding:40px 24px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:18px;margin:32px 0 16px}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.kpi .value{font-size:28px;font-weight:650;letter-spacing:-.01em}
.kpi .label{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.icon{width:20px;height:20px;flex:none}
.row{display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:500;font-size:13px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:8px 16px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){main{padding:24px 16px}h1{font-size:24px}}
</style>
</head>
<body>
<main>
  <header>
    <span class="badge">Label</span>
    <h1>Page title</h1>
    <p class="lead">One sentence that says what this page shows.</p>
  </header>

  <h2>Key figures</h2>
  <div class="grid">
    <div class="card kpi"><div class="label">Measure</div><div class="value">0</div></div>
    <div class="card kpi"><div class="label">Measure</div><div class="value">0</div></div>
    <div class="card kpi"><div class="label">Measure</div><div class="value">0</div></div>
  </div>

  <h2>Section</h2>
  <div class="card">
    <!-- chart, table, diagram: see references/patterns.md -->
  </div>
</main>
</body>
</html>
